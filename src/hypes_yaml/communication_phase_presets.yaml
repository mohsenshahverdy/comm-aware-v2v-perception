communication_presets:
  phase0_baseline:
    enabled: false
    phase: "phase0"
    strategy: "none"
    drop_ego: false

  phase1_measurement:
    enabled: true
    phase: "phase1"
    strategy: "none"
    drop_ego: false

  # Backward-compatible alias: keeps the original random-drop behavior.
  phase2_random_drop:
    enabled: true
    phase: "phase2"
    strategy: "random_drop"
    drop_ego: false
    drop_random:
      keep_ratio: 0.1

  # Explicit stress-test mode: drops ego + collaborator features.
  phase2_random_drop_all_features:
    enabled: true
    phase: "phase2"
    strategy: "random_drop_all_features"
    drop_ego: false
    drop_random:
      keep_ratio: 0.1

  # Communication-only baseline: keep ego fixed, drop collaborators only.
  phase2_random_drop_comm_only:
    enabled: true
    phase: "phase2"
    strategy: "random_drop_comm_only"
    drop_ego: false
    drop_random:
      keep_ratio: 0.1

  phase2_random_comm_only_05:
    enabled: true
    phase: "phase2"
    strategy: "random_drop_comm_only"
    drop_ego: false
    drop_random:
      keep_ratio: 0.05

  phase2_random_comm_only_10:
    enabled: true
    phase: "phase2"
    strategy: "random_drop_comm_only"
    drop_ego: false
    drop_random:
      keep_ratio: 0.10

  phase2_random_comm_only_25:
