name: point_pillar_intermediate_V2VAM_nocompressionV2
communication_preset: baseline_full_communication
#################################### Directory Setup  ####################################
sub_name: 
root_dir: "training_data/train" # Set this path to your training dataset root.
validate_dir: "validating_data/validate"

#################################### Parser Setup  ####################################
yaml_parser: "load_point_pillar_params" # Name of the parser


reproducibility:
  seed: 42
  deterministic: false
  benchmark: true


#################################### Training Parameters  ####################################
train_params:
  batch_size: &batch_size 4 # Batch size 2 and 4 for val and testing. Written in Point-Pillar paper
  epoches: 65  # 160 and 320. Written in Point-Pillar paper
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 5 # Written  in V2VAM paper


#################################### Fusion Parameters  ####################################
fusion:
  core_method: 'IntermediateFusionDataset' # Current repo registration supports IntermediateFusionDataset.
  args: []


#################################### preprocess Parameters  ####################################
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4] # Writen in V2VAM paper
    max_points_per_voxel: 32 # Maximum number of randomly selected points per non-empty voxels. In the Voxel-Net this number is 35 not 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]
data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]


#################################### postprocess Parameters  ####################################
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  anchor_args:
    cav_lidar_range: *cav_lidar
    # The following parms [l,w,h,r,pos_threshold,neg_threshold] are for anchor box, shwon in Voxel-Net Paper and Piont-Pillar paper
    # The following args for defining the pre-defined anchor boxes.
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 4
    num: &achor_num 2 # We define two anchor to consider both 0 and 90 degree
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl' # hwl or lwh : refer to the order in which the dimensions of the bounding box are specified
  max_num: 100  # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15 # Non-Maximum Suppression


#################################### Model Parameters  ####################################
model:
  core_method: point_pillar_intermediate_V2VAM
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    max_cav: *max_cav
    compression: 0 #32 # compression rate
    backbone_fix: false

    pillar_vfe:
      use_norm: true # Batch_normalization
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64 # num_bev_features

    base_bev_backbone: # Base backbone comes from VoxelNet Paper
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384 # 128 * 3
    communication:
      enabled: false
      strategy: "none" # none | random_drop | random_drop_all_features | random_drop_comm_only | topk_energy | learnable_mask | receiver_request_topk | receiver_request_learned
      seed: 42
      measurement:
        track_bytes: true
        track_active_cells: true
        track_active_neighbors: true
        track_latency: true
      drop_ego: false
      drop_random:
        keep_ratio: 0.5
      topk_energy:
        keep_ratio: 0.1
        score_type: "l2" # l2 | l1_mean
      neighbor_selection:
        mode: "all" # all | nearest | topk_importance
        k: 2
        distance_metric: "euclidean"
      packet_loss:
        enabled: false
        loss_rate: 0.0
        unit: "cell"
      learnable_mask:
        enabled: false
        mask_channels: 16
        sparsity_lambda: 0.001
        use_budget_loss: false
        budget_lambda: 1.0
        target_ratio: 0.10
        temperature: 1.0
        hard_mask: false
      receiver_request:
        enabled: false
        implementation_status: "implemented" # implemented | planned
        strategy_variant: "energy_topk" # energy_topk | uncertainty_topk | visibility_topk | learned | learned_budget | warped
        trainable: false
        keep_ratio: 0.10
        score_type: "multiplicative" # multiplicative | weighted_sum | max_gate
        need_power: 1.0
        context_power: 1.0
        alpha: 1.0
        beta: 1.0
        normalize_scores: true
        drop_ego: false
        ego_need_type: "inverse_energy" # inverse_energy | uncertainty | visibility | learned
        ego_need_eps: 1.0e-6
        collaborator_context_type: "l2" # l2 | objectness | visibility | learned
        context_resolution: "full" # full | half | quarter
        context_quantization_bits: 32 # 32 | 16 | 8 | 1
        count_context_overhead: true
        alignment_mode: "ego_aligned" # Stage1 assumes BEV features are ego-aligned in IntermediateFusionDataset (proj_first=True)
        use_pairwise_transform: true
        count_mask_metadata: true
        metadata_encoding: "dense_binary" # dense_binary | sparse_indices | none
        min_score_threshold: null
        active_neighbor_mode: "all"
        max_active_neighbors: null
        save_request_maps: false
        save_debug_npz: false
        debug_num_frames: 5
        temporal:
          enabled: false
          init_mode: "full_request" # full_request | high_ratio | normal
          init_frames: 1
          init_keep_ratio: 1.0
          cache_type: "context_energy"
          cache_momentum: 0.9
          cache_confidence_decay: 0.95
          max_cache_age: 5
          novelty_type: "absolute_diff" # absolute_diff | squared_diff | normalized_diff
          novelty_weight: 1.0
          age_weight: 0.05
          cache_confidence_weight: 0.5
          min_temporal_factor: 0.25
          max_temporal_factor: 3.0
          periodic_refresh_enabled: false
          periodic_refresh_interval: 10
          periodic_refresh_keep_ratio: 0.25
          save_temporal_maps: false
          debug_num_frames: 5
        # Planned roadmap (config placeholders only, heavy methods not implemented yet):
        # - uncertainty_topk: requires ego-only uncertainty/entropy exposure before fusion.
        # - visibility_topk: requires BEV density/visibility/occlusion maps.
        # - learned: requires trainable request head + optional separate LR/freeze controls.
        # - learned_budget: requires config-gated sparse+budget losses.
        # - warped: requires warp_context_to_ego and warp_mask_to_sender utilities.
        loss:
          enabled: false
          sparse_lambda: 0.0
          budget_enabled: false
          budget_lambda: 0.0
          target_ratio: 0.10
          apply_to: "collaborators_only"
        optimizer:
          separate_lr: false
          request_head_lr: 1.0e-4
          freeze_detector: false
          freeze_backbone: false
      repair_network:
        enabled: false
        type: "conv"
        hidden_dim: 128
        loss_weight: 0.1
      logging:
        save_csv: true
        save_per_frame_json: true
        save_per_step_json: true
        save_per_epoch_json: true
        save_validation_json: true
        learned_loss_fields:
          - learned_sparse_loss
          - learned_budget_loss
          - learned_total_loss
          - learned_request_prob_mean
          - learned_effective_keep_ratio
          - learned_budget_error
          - learned_mask_entropy
      visualization:
        plot_curves: true

#################################### Optimizer Parameters  ####################################
optimizer:
  core_method: Adam
  lr: 1e-3 # it is 1e-7
  args:
    eps: 1e-10 # epsilon used for normalization to prevent zero result
    weight_decay: 1e-4
#################################### Loss Parameters  ####################################
loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0
#################################### Learning Rate Scheduler Parameters  ####################################
lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10,20,30,50,60] # Default [15,40,60]
