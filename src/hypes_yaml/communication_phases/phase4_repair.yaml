communication_preset: phase4_repair
data_augment:
- ALONG_AXIS_LIST:
  - x
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
fusion:
  args: []
  core_method: IntermediateFusionDataset
loss:
  args:
    cls_weight: 1.0
    reg: 2.0
  core_method: point_pillar_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 20
  - 30
  - 50
  - 60
model:
  args:
    anchor_number: 2
    backbone_fix: false
    base_bev_backbone:
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 2
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      num_upsample_filter:
      - 128
      - 128
      - 128
      upsample_strides:
      - 1
      - 2
      - 4
    communication:
      drop_random:
        keep_ratio: 0.5
      enabled: true
      learnable_mask:
        enabled: true
        hard_mask: false
        mask_channels: 16
        sparsity_lambda: 0.01
        temperature: 1.0
      logging:
        save_csv: true
        save_per_frame_json: true
      measurement:
        track_active_cells: true
        track_active_neighbors: true
        track_bytes: true
        track_latency: true
      neighbor_selection:
        distance_metric: euclidean
        k: 2
        mode: all
      packet_loss:
        enabled: true
        loss_rate: 0.2
        unit: cell
      phase: phase4
      repair_network:
        enabled: true
        hidden_dim: 128
        loss_weight: 0.1
        type: conv
      seed: 42
      strategy: learnable_mask
      topk_energy:
        keep_ratio: 0.1
        score_type: l2
      visualization:
        plot_curves: true
    compression: 0
    lidar_range: &id001
    - -140.8
    - -40
    - -3
    - 140.8
    - 40
    - 1
    max_cav: 5
    pillar_vfe:
      num_filters:
      - 64
      use_absolute_xyz: true
      use_norm: true
      with_distance: false
    point_pillar_scatter:
      grid_size: !!python/object/apply:numpy._core.multiarray._reconstruct
        args:
        - !!python/name:numpy.ndarray ''
        - !!python/tuple
          - 0
        - !!binary |
          Yg==
        state: !!python/tuple
        - 1
        - !!python/tuple
          - 3
        - !!python/object/apply:numpy.dtype
          args:
          - i8
          - false
          - true
          state: !!python/tuple
          - 3
          - <
          - null
          - null
          - null
          - -1
          - -1
          - 0
        - false
        - !!binary |
          wAIAAAAAAADIAAAAAAAAAAEAAAAAAAAA
      num_features: 64
    shrink_header:
      dim:
      - 256
      input_dim: 384
      kernal_size:
      - 3
      padding:
      - 1
      stride:
      - 2
    voxel_size: &id002
    - 0.4
    - 0.4
    - 4
  core_method: point_pillar_intermediate_V2VAM
name: point_pillar_intermediate_V2VAM_nocompressionV2
optimizer:
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
  core_method: Adam
  lr: 0.001
postprocess:
  anchor_args:
    D: 1
    H: 200
    W: 704
    cav_lidar_range: *id001
    feature_stride: 4
    h: 1.56
    l: 3.9
    num: 2
    r:
    - 0
    - 90
    vd: 4
    vh: 0.4
    vw: 0.4
    w: 1.6
  core_method: VoxelPostprocessor
  max_num: 100
  nms_thresh: 0.15
  order: hwl
  target_args:
    neg_threshold: 0.45
    pos_threshold: 0.6
    score_threshold: 0.2
preprocess:
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 32000
    voxel_size: *id002
  cav_lidar_range: *id001
  core_method: SpVoxelPreprocessor
root_dir: training_data/train
sub_name: null
train_params:
  batch_size: 4
  epoches: 65
  eval_freq: 1
  max_cav: 5
  save_freq: 1
validate_dir: validating_data/validate
yaml_parser: load_point_pillar_params
